<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    .bd-sidebar {
      position: sticky;
      top: 4rem;
      height: calc(100vh - 4rem);
      overflow-y: auto;
    }
  </style>
</head>
<body class="bg-body-tertiary">

  <!-- Top Navigation Bar -->
  <header class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top px-3 shadow-sm">
    <a class="navbar-brand fw-bold" href="/">{{ site.title }}</a>
    <div class="ms-auto">
      <a href="https://github.com/adarshsprabhakaran" class="text-white fs-5" target="_blank">
        <i class="bi bi-github"></i>
      </a>
    </div>
  </header>

  <!-- Main Container -->
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar Navigation -->
      <nav class="col-md-3 col-lg-2 d-md-block bg-white bd-sidebar p-3 border-end">
        <h6 class="text-uppercase text-muted fw-bold mb-3">Navigation</h6>
        <ul class="nav flex-column">
          <li class="nav-item">
            <a class="nav-link text-secondary" href="/">Home</a>
          </li>
          {% for post in site.posts %}
            <li class="nav-item">
              <a class="nav-link text-secondary" href="{{ post.url }}">{{ post.title }}</a>
            </li>
          {% endfor %}
        </ul>
      </nav>

      <!-- Main Content Area -->
      <main class="col-md-9 col-lg-10 ms-sm-auto px-md-5 py-4 bg-white min-vh-100">
        {{ content }}
      </main>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
