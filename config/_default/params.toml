      <button onclick="document.getElementById('mit-modal').style.display='none';" style="padding: 0.5rem 1.25rem; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem;">Close</button>
