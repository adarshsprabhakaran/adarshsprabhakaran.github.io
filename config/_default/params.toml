copyright = """
<div style="font-size: 0.85rem; line-height: 1.5; color: var(--color-neutral-400);">
  Copyright © 2026Designed and built with all the love in the world by <span style="font-weight: 600; color: var(--color-neutral-200);">Adarsh Prabhakaran</span> with the help of our contributors.<br>
