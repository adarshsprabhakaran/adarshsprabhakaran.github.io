</div>

<style>
  /* Forces the Hugo & Blowfish attribution text to match the license text styling */
  footer .text-sm, footer span, footer a {
    font-size: 0.85rem !important;
  }
</style>

<div id="mit-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); z-index: 9999; justify-content: center; align-items: center;">
  <div style="background: var(--color-neutral-900, #111827); color: var(--color-neutral-100, #f3f4f6); padding: 2rem; border-radius: 12px; border: 1px solid var(--color-neutral-700, #374151); max-width: 600px; width: 90%; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);">
    <h3 style="margin-top: 0; margin-bottom: 1rem; font-size: 1.25rem; font-weight: bold; border-bottom: 1px solid var(--color-neutral-700, #374151); padding-bottom: 0.5rem;">MIT License</h3>
